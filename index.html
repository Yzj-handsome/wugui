<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>物归 · 武汉大学失物招领</title>
  <meta name="description" content="武汉大学校园失物招领：描述或上传照片，AI 帮你从珞珈山的线索里找到可能匹配的物品。" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/app.css" />
  <script>
    /* 亮色是默认主题；用户手动切过就按 localStorage 来。
       这段必须放在 CSS 之前执行，否则首屏会闪一下。 */
    (function () {
      try {
        var saved = localStorage.getItem('wugui-theme');
        document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : '';
      } catch (e) {
        document.documentElement.dataset.theme = '';
      }
    })();
  </script>
  <script src="./demo-data.js"></script>
  <script src="./demo-shim.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主内容</a>

  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="brand" href="#/" aria-label="物归首页">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3.2c-5 0-9 4-9 9 0 6.4 9 16.6 9 16.6s9-10.2 9-16.6c0-5-4-9-9-9z" fill="currentColor"/>
          <circle cx="16" cy="12" r="3.6" fill="#fff"/>
        </svg>
        <span class="brand__name">物归</span>
        <span class="brand__sub">武汉大学 · 失物招领</span>
      </a>

      <nav class="nav__links" aria-label="主导航">
        <a href="#/" data-nav="home">找物品</a>
        <a href="#/post" data-nav="post">发布信息</a>
        <a href="#/inbox" data-nav="inbox">消息<span class="nav__badge" id="navBadge" hidden></span></a>
        <a href="#/hall" data-nav="hall">办事大厅</a>
      </nav>

      <div class="nav__right">
        <button class="icon-btn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 109.8 9.8z" fill="currentColor"/></svg>
        </button>
        <div class="user" id="userBox"></div>
      </div>
    </div>
  </header>

  <main id="main" class="main"></main>

  <footer class="footer">
    <div class="footer__inner">
      <div>
        <strong>物归</strong> · 图文统一解析 → 跨模态匹配 → 主动推送 → 验证认领
      </div>
      <div class="footer__meta" id="footerMeta"></div>
      <div class="footer__links">
        <a href="#/hall">办事大厅</a>
        <a href="/docs" target="_blank" rel="noreferrer">接口文档</a>
        <button class="linklike" id="agentBtn">问智能体</button>
      </div>
    </div>
  </footer>

  <!-- 智能体对话框 -->
  <button class="agent-fab" id="agentFab" title="问智能体" aria-label="问智能体">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3c5 0 9 3.4 9 7.6 0 4.2-4 7.6-9 7.6-.9 0-1.8-.1-2.6-.3L5 21l.9-3.6C4.1 16.1 3 13.9 3 10.6 3 6.4 7 3 12 3z" fill="currentColor"/>
    </svg>
  </button>
  <aside class="agent" id="agent" hidden aria-label="智能体对话">
    <div class="agent__head">
      <div>
        <strong>物归智能体</strong>
        <span class="muted" id="agentSub">发布、查找、认领都能问我</span>
      </div>
      <button class="icon-btn" id="agentClose" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="agent__body" id="agentBody"></div>
    <form class="agent__foot" id="agentForm">
      <input id="agentInput" placeholder="例如：周二下午在图书馆三楼丢了黑色耳机" autocomplete="off" />
      <button class="btn btn--primary" type="submit">发送</button>
    </form>
  </aside>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
